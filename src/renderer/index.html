<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Unified Messenger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="rail">
      <button id="allBtn" class="rail-btn active" title="All messengers in one list, newest first">All</button>

      <button class="rail-btn" data-svc="tg2" title="Telegram, account 2" hidden><span class="logo tg"><svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></span><i class="two">2</i></button>
      <button class="rail-btn" data-svc="wa" title="WhatsApp (right click: second account)"><span class="logo wa"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span></button>
      <button class="rail-btn" data-svc="wa2" title="WhatsApp, account 2" hidden><span class="logo wa"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span><i class="two">2</i></button>
      <button class="rail-btn" data-svc="ei" title="Eitaa (right click: second account)"><span class="logo ei"><b>E</b><img alt="" hidden></span></button>
      <button class="rail-btn" data-svc="ei2" title="Eitaa, account 2" hidden><span class="logo ei"><b>E</b><img alt="" hidden></span><i class="two">2</i></button>
      <button class="rail-btn" data-svc="ba" title="Bale (right click: second account)"><span class="logo ba"><b>B</b><img alt="" hidden></span></button>
      <button class="rail-btn" data-svc="ba2" title="Bale, account 2" hidden><span class="logo ba"><b>B</b><img alt="" hidden></span><i class="two">2</i></button>
      <button class="rail-btn" data-svc="ru" title="Rubika (right click: second account)"><span class="logo ru"><b>R</b><img alt="" hidden></span></button>
      <button class="rail-btn" data-svc="ru2" title="Rubika, account 2" hidden><span class="logo ru"><b>R</b><img alt="" hidden></span><i class="two">2</i></button>
      <button id="inspectBtn" class="rail-btn" title="Save the page structure of the open web client to the Desktop">Scan</button>
    </nav>
    <aside id="sidebar">
      <div class="side-top">
        <input id="search" type="search" placeholder="Search chats" autocomplete="off">
        <button id="accountsBtn" class="icon-btn" title="Messengers, accounts and settings">
          <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.4-2.5c.04-.33.1-.66.1-1s-.06-.67-.1-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.63.25-1.2.58-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.04.33-.1.66-.1 1s.06.67.1 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.3.61.22l2.49-1c.53.42 1.1.75 1.73 1l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.63-.25 1.2-.58 1.73-1l2.49 1c.22.09.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13z"/></svg>
          <span id="statusDot"></span>
        </button>
      </div>
      <div id="chatList"></div>
    </aside>

    <main id="main">
      <section id="feed">
        <header id="feedHead"><h2>All</h2><div id="feedTabs"></div></header>
        <div id="feedList"></div>
      </section>
      <section id="chatView" hidden>
        <header id="chatHeader">
          <div id="hAvatar" class="avatar"></div>
          <div class="h-text"><div id="hTitle"></div><div id="hSub"></div></div>
        </header>
        <div id="messages"></div>
        <div id="pending" hidden></div>
        <footer id="composer">
          <button id="attachBtn" class="icon-btn" title="Attach files">
            <svg viewBox="0 0 24 24"><path d="M16.5 6.5v9a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V6.5H9.5v8a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v10.5a6 6 0 0 0 12 0v-9z"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Write a message"></textarea>
          <button id="sendBtn" class="icon-btn accent" title="Send">
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </footer>
        <div id="drop" hidden><div id="dropText"></div></div>
      </section>
    </main>
  </div>

  <div id="menu" hidden></div>
  <div id="toast" hidden></div>
  <div id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h2>Messengers</h2><button id="closeModal" class="icon-btn" title="Close">&times;</button></div>
      <div id="accounts"></div>
      <div class="modal-foot">
        <span id="cacheInfo"></span>
        <button id="clearCache" class="btn">Clear download cache</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
