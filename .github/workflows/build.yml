name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        shell: pwsh
        run: |
          npm run dist *> build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Output "::error title=build-failure::$tail"
            exit $code
          }
      - uses: actions/upload-artifact@v4
        with:
          name: unified-messenger-windows
          path: dist/*.exe
